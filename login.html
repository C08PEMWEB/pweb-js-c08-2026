<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk ke Akun - Mini Shopee</title>
  
  <!-- CSS Murni (Native) -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />

  <!-- JavaScript Eksternal dengan atribut defer (Wajib sesuai ketentuan) -->
  <script src="js/auth.js" defer></script>
</head>
<body class="login-page-body">

  <!-- Header Sederhana Halaman Login -->
  <header class="login-header">
    <div class="container">
      <a href="login.html" class="brand-title">
        🛍️ Mini Shopee <span>Praktikum Modul 2</span>
      </a>
      <span style="font-size: 0.9rem; color: var(--text-secondary);">Bantuan?</span>
    </div>
  </header>

  <!-- Konten Utama Login (Tanggung Jawab: Anggota 1) -->
  <main class="login-main">
    <div class="login-card">
      <h2>Masuk ke akunmu</h2>
      <p class="subtitle">Gunakan username & password akunmu.</p>

      <!-- Alert Pesan Error (Error Handling Visual) -->
      <div id="loginErrorContainer" class="alert alert-error hidden">
        <span>⚠️</span>
        <span id="loginErrorMessage"></span>
      </div>

      <!-- Form Login -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Masukkan username Anda"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Masukkan password Anda"
            required
          />
        </div>

        <button type="submit" id="btnSubmitLogin" class="btn btn-primary btn-login">
          <span id="btnSubmitSpinner" class="spinner hidden"></span>
          <span id="btnSubmitText">Masuk</span>
        </button>
      </form>

      <!-- Petunjuk Akun Demo DummyJSON -->
      <div class="demo-hint">
        💡 <strong>Info Akun Uji Coba (DummyJSON):</strong><br />
        Username: <code>emilys</code> | Password: <code>emilyspass</code><br />
        Username: <code>michaelw</code> | Password: <code>michaelwpass</code>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Mini Shopee - Praktikum Pemrograman Web C08 (Native Front-End)</p>
    </div>
  </footer>

</body>
</html>
